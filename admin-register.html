<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Registration | SmartAttend</title>
    <link rel="stylesheet" href="admin-register.css">
</head>
<body>

    <div class="register-container">
        <div class="register-header">
            <h1>SmartAttend</h1>
            <p>Administrator Portal</p>
        </div>

        <div class="register-card">
            <h2>Create Admin's Account</h2>
            <p class="subtitle">Register to manage the SmartAttend system.</p>

            <form id="adminRegisterForm">
                <div class="form-group">
                    <label for="adminName">Full Name</label>
                    <input type="text" id="adminName"
                        placeholder="Enter your full name" required>
                </div>

                <div class="form-group">
                    <label for="adminEmail">Email Address</label>
                    <input type="email" id="adminEmail"
                        placeholder="Enter your email" required>
                </div>

                <div class="form-group">
                    <label for="adminId">Administrator ID</label>
                    <input type="text" id="adminId"
                        placeholder="Enter your admin ID" required>
                </div>

                <div class="form-group">
                    <label for="adminPassword">Password</label>
                    <input type="password" id="adminPassword"
                        placeholder="Create a password" minlength="8" required>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword"
                        placeholder="Re-enter your password" minlength="8" required>
                </div>

                <button type="submit" class="register-btn">
                    Create Account
                </button>

                <p id="registerMessage" role="status"></p>
            </form>

            <p class="login-link">
                Already registered?
                <a href="admin-login.html">Log in here</a>
            </p>

            <a href="home.html" class="back-link">← Back to Home</a>
        </div>

        <p class="footer-text">
            © 2026 SmartAttend. All rights reserved.
        </p>
    </div>
      <script src="admin-register.js"></script>
</body>
</html>
