<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | SmartAttend</title>
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="register.css">
</head>

<body>

<main class="register-page">

    <div class="register-header">
        <div class="register-brand">
            <span class="smart-text">Smart</span><span class="attend-text">Attend</span>
        </div>
        <p>Join SmartAttend and make attendance smarter.</p>
    </div>

    <section class="register-card">

        <div class="register-heading">
            <span class="welcome-label">NEW STUDENT</span>
            <h1>Create your account</h1>
            <p>Fill in your details to get started.</p>
        </div>

        <form id="registerForm">

            <div class="register-grid">

                <div class="form-group">
                    <label for="fullName">Full name</label>
                    <input type="text" id="fullName" name="fullName"
                        placeholder="Enter your full name"
                        autocomplete="name" required>
                </div>

                <div class="form-group">
                    <label for="studentId">Student ID</label>
                    <input type="text" id="studentId" name="studentId"
                        placeholder="Enter your student ID" required>
                </div>

                <div class="form-group">
                    <label for="registerEmail">Email address</label>
                    <input type="email" id="registerEmail" name="email"
                        placeholder="you@example.com"
                        autocomplete="email" required>
                </div>

                <div class="form-group">
                    <label for="department">Department / Programme</label>
                    <input type="text" id="department" name="department"
                        placeholder="e.g. Business IT" required>
                </div>

                <div class="form-group">
                    <label for="level">Academic level</label>
                    <select id="level" name="level" required>
                        <option value="">Select your level</option>
                        <option value="100">Freshman</option>
                        <option value="200">Sophomore</option>
                        <option value="300">Junior</option>
                        <option value="400">Senior</option>
                        <option value="other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="registerPassword">Create password</label>
                    <input type="password" id="registerPassword"
                        name="password" placeholder="At least 8 characters"
                        minlength="8" autocomplete="new-password" required>
                </div>

                <div class="form-group full-width">
                    <label for="confirmPassword">Confirm password</label>
                    <input type="password" id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Enter your password again"
                        minlength="8" autocomplete="new-password" required>
                </div>

            </div>

            <label class="terms-option">
                <input type="checkbox" id="agreeTerms" required>
                <span>I confirm that the information I provided is correct.</span>
            </label>

            <button type="submit" class="login-button">
                Create Account <span>→</span>
            </button>

            <p id="registerMessage" class="login-message"
                aria-live="polite"></p>

        </form>

        <p class="signup-text existing-account">
            Already have an account?
            <a href="login.html">Log in</a>
        </p>

        <a href="home.html" class="back-home">
            ← Back to homepage
        </a>

    </section>

</main>

<script src="register.js"></script>
</body>
</html>
