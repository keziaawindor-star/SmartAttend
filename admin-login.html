<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | SmartAttend</title>
    <link rel="stylesheet" href="admin-login.css">
</head>
<body>

    <div class="login-container">
        <div class="login-header">
            <h1>SmartAttend</h1>
            <p>Administrator Portal</p>
        </div>

        <div class="login-card">
            <h2>Welcome Back</h2>
            <p class="subtitle">Log in to manage the SmartAttend system.</p>

            <form id="adminLoginForm">
                <div class="form-group">
                    <label for="adminEmail">Email Address</label>
                    <input type="email" id="adminEmail"
                        placeholder="Enter your registered email" required>
                </div>

                <div class="form-group">
                    <label for="adminPassword">Password</label>
                    <input type="password" id="adminPassword"
                        placeholder="Enter your password" required>
                </div>

                <button type="submit" class="login-btn">Log In</button>

                <p id="loginMessage" role="status"></p>
            </form>

            <p class="register-link">
                Don't have an account?
                <a href="admin-register.html">Register here</a>
            </p>

            <a href="home.html" class="back-link">← Back to Home</a>
        </div>

        <p class="footer-text">
            © 2026 SmartAttend. All rights reserved.
        </p>
    </div>

    <script src="admin-login.js"></script>
</body>
</html>
