<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lecturer Registration | SmartAttend</title>
    <link rel="stylesheet" href="lecturer-register.css">
</head>
<body>

    <main class="register-container">
        <div class="register-card">

            <a href="home.html" class="brand">
                <span>Smart</span>Attend
            </a>

            <div class="heading">
                <h1>Lecturer Registration</h1>
                <p>Create your lecturer account to manage courses and attendance.</p>
            </div>

            <form id="lecturerRegisterForm">

                <div class="form-group">
                    <label for="lecturerName">Full Name</label>
                    <input type="text" id="lecturerName"
                           placeholder="Enter your full name" required>
                </div>

                <div class="form-group">
                    <label for="staffId">Staff ID</label>
                    <input type="text" id="staffId"
                           placeholder="Enter your staff ID" required>
                </div>

                <div class="form-group">
                    <label for="lecturerEmail">Email Address</label>
                    <input type="email" id="lecturerEmail"
                           placeholder="Enter your email" required>
                </div>

                <div class="form-group">
                    <label for="department">Department</label>
                    <input type="text" id="department"
                           placeholder="e.g. Business Information Technology"
                           required>
                </div>

                <div class="form-group">
                    <label for="lecturerPassword">Password</label>
                    <input type="password" id="lecturerPassword"
                           placeholder="Create a password"
                           minlength="8" required>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword"
                           placeholder="Enter your password again"
                           minlength="8" required>
                </div>

                <p id="registerMessage" role="status" aria-live="polite"></p>

                <button type="submit" class="register-btn">
                    Create Lecturer Account
                </button>

            </form>

            <p class="login-text">
                Already registered?
                <a href="lecturer-login.html">Log in here</a>
            </p>

            <p class="back-home">
                <a href="home.html">← Back to homepage</a>
            </p>

        </div>
    </main>

    <script src="lecturer-register.js"></script>
</body>
</html>
